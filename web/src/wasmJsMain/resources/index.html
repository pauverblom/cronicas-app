<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Crónicas de la Marca</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <!-- «black» y no «black-translucent»: con el translúcido, iOS/iPadOS 26 dan a la app instalada una ventana más baja
         que la pantalla (WebKit 301108) y queda una franja negra abajo; con «black» el iPhone reserva su barra -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="Crónicas">
    <meta name="theme-color" content="#07080E">
    <link rel="manifest" href="manifest.webmanifest">
    <style>
        :root {
            --noche: #07080E;
            /* Sitio para la barra de estado. iPadOS 26 la pone siempre encima de la app y no siempre informa de su
               alto (WebKit 301994): en un iPad instalado se deja al menos 28px (ver el script de abajo). */
            --arriba: env(safe-area-inset-top, 0px);
            --abajo: env(safe-area-inset-bottom, 0px);
        }
        html[data-ipad-instalada] { --arriba: max(env(safe-area-inset-top, 0px), 28px); }
        html, body { margin: 0; height: 100%; background: var(--noche); overflow: hidden; overscroll-behavior: none; }
        /* Instalada en la pantalla de inicio, la página ocupa toda la pantalla aunque WebKit dé una ventana más baja */
        @media (display-mode: standalone) {
            html { height: min(100lvh, calc(100% + env(safe-area-inset-top, 0px))); }
        }
        body { position: relative; }
        #app { position: absolute; left: 0; right: 0; top: var(--arriba); bottom: var(--abajo); }
        /* Franja bajo la barra de estado, del color de la noche. En iPad tapa además el desenfoque que iPadOS 26
           pone bajo la barra: solo lo cambia por un color liso si arriba hay un elemento fijo de casi todo el ancho
           y más de 10px de alto */
        #barra { display: none; position: fixed; top: 0; left: 0; right: 0; height: var(--arriba); background: var(--noche);
                 z-index: 2147483647; pointer-events: none; }
        html[data-ipad-instalada] #barra { display: block; }
        /* Mantener pulsado abre menús de la app: que iOS no seleccione texto ni saque su menú */
        body, canvas { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
        #carga { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
                 color: #c9a45c; font: 18px Georgia, serif; letter-spacing: .08em; }
    </style>
    <script>
        // iPad con la app añadida a la pantalla de inicio (el iPad se presenta como Mac, pero es táctil)
        (function () {
            var instalada = window.navigator.standalone === true || window.matchMedia("(display-mode: standalone)").matches;
            var ipad = /iPad/.test(navigator.userAgent) || (/Macintosh/.test(navigator.userAgent) && navigator.maxTouchPoints > 1);
            if (instalada && ipad) document.documentElement.setAttribute("data-ipad-instalada", "");
        })();
    </script>
    <!-- Configuración de Firebase (la escribe la publicación desde un secreto; sin ella, la app funciona sin nube) -->
    <script src="firebase-config.js" onerror="window.FIREBASE_CONFIG = null"></script>
    <script src="ayudas.js"></script>
    <script type="module" src="nube.js"></script>
    <script src="cronicas.js"></script>
</head>
<body>
<div id="app"></div>
<div id="barra"></div>
<div id="carga">Cargando la Marca…</div>
</body>
</html>

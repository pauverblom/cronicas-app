name: CI

# Make sure every pull request and push to main still compiles (Android and web) and the rules tests pass.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v5

      - run: ./gradlew testDebugUnitTest assembleDebug :web:compileKotlinWasmJs

name: Release

# Push a tag like v0.2.0 to build a signed APK and publish it as a GitHub Release.
# Obtainium picks up the release and offers the update.
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v5

      - name: Compute version from tag
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"
          if ! [[ "$TAG" =~ ^v([0-9]+)\.([0-9]{1,2})\.([0-9]{1,2})$ ]]; then
            echo "::error::Tag '$TAG' must look like vMAJOR.MINOR.PATCH (minor/patch < 100)"
            exit 1
          fi
          NAME="${TAG#v}"
          CODE=$(( 10#${BASH_REMATCH[1]} * 10000 + 10#${BASH_REMATCH[2]} * 100 + 10#${BASH_REMATCH[3]} ))
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "versionName=$NAME versionCode=$CODE"

      - name: Decode signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Repository secret KEYSTORE_BASE64 is not set"
            exit 1
          fi
          # Strip whitespace/CRLF that sneaks in when pasting the secret (e.g. from Windows).
          if ! printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > "$RUNNER_TEMP/release.jks"; then
            echo "::error::KEYSTORE_BASE64 is not valid base64. Re-create it from the .jks file (see README)."
            exit 1
          fi

      # Sign a throwaway jar with the same alias/passwords Gradle will use, so a bad
      # secret fails here with a clear message instead of at the end of the build.
      - name: Verify signing key
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          KS="$RUNNER_TEMP/release.jks"
          KEY_ALIAS="$(printf '%s' "$KEY_ALIAS" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
          KEY_PASSWORD="${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
          if ! keytool -list -keystore "$KS" -storepass "$KEYSTORE_PASSWORD" > "$RUNNER_TEMP/keys.txt" 2>&1; then
            echo "::error::Could not open the keystore: KEYSTORE_PASSWORD is wrong or KEYSTORE_BASE64 is not the .jks file."
            exit 1
          fi
          echo "Keys in the keystore:"
          grep -i "PrivateKeyEntry" "$RUNNER_TEMP/keys.txt" | cut -d, -f1 | sed 's/^/  /'
          echo probe > "$RUNNER_TEMP/probe.txt"
          jar cf "$RUNNER_TEMP/probe.jar" -C "$RUNNER_TEMP" probe.txt
          if ! jarsigner -keystore "$KS" -storepass "$KEYSTORE_PASSWORD" -keypass "$KEY_PASSWORD" \
              "$RUNNER_TEMP/probe.jar" "$KEY_ALIAS" > "$RUNNER_TEMP/jarsigner.txt" 2>&1; then
            cat "$RUNNER_TEMP/jarsigner.txt"
            echo "::error::Could not sign with key KEY_ALIAS. Either KEY_ALIAS is not one of the keys listed above, or the key has its own password: add it as the KEY_PASSWORD secret."
            exit 1
          fi
          echo "Signing key OK"

      - name: Build signed APK
        env:
          CRONICAS_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          CRONICAS_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          CRONICAS_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          CRONICAS_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: >
          ./gradlew assembleRelease
          -PversionName=${{ steps.version.outputs.name }}
          -PversionCode=${{ steps.version.outputs.code }}

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK="cronicas-marca-${GITHUB_REF_NAME}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK"
          gh release create "$GITHUB_REF_NAME" "$APK" --title "$GITHUB_REF_NAME" --generate-notes
